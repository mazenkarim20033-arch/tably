# Runs all tests on every push. To enable, copy to .github/workflows/tests.yml
# (GitHub only accepts workflow files from tokens with the "workflow" scope, or via the website editor).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: apps/api
      - name: Web build
        run: npm run build -w @tably/web
