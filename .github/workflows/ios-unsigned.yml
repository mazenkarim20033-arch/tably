name: Build unsigned iOS IPA (for Sideloadly)

# Produces an UNSIGNED .ipa. Sideloadly signs it on your PC with your free Apple ID.
# Free Apple IDs: the app expires after 7 days and must be re-installed; max 3 sideloaded apps.
# The real work is in scripts/ci-ios-build.sh so it can be changed without editing this file.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # reuse downloaded JavaScript packages between builds
      - name: Cache CocoaPods and compiled iOS code
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            ~/tably-derived
          # Changes when dependencies or app config change; otherwise the compiled code is reused.
          key: ios-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/app.json') }}
          restore-keys: |
            ios-${{ runner.os }}-
      - name: Build unsigned IPA
        run: bash scripts/ci-ios-build.sh
        env:
          # Optional fallback server address. The app normally takes it from Home > Server settings.
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: TABLY-unsigned-ipa
          path: apps/mobile/ios/TABLY-unsigned.ipa
