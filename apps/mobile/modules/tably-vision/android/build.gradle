plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tablyvision'
version = '1.0.0'

android {
  namespace "expo.modules.tablyvision"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Google ML Kit text recognition with the Latin model bundled in the app (works offline, no Play Services download).
  // It reads English letters and digits; it does not read Arabic script (see docs/android.md).
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
