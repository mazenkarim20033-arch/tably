# Render blueprint (optional). Any host that runs a Docker image works the same way; see docs/deploy.md.
services:
  - type: web
    name: tably
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon POOLED connection string; paste in the dashboard, never commit it
      - key: DATABASE_URL_UNPOOLED
        sync: false # Neon DIRECT connection string, used for migrations
      - key: TABLY_PAYMENT_LINK_HOSTS
        value: ipn.eg
